<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="默认头像：一个正在摸鱼的代肝人">
  <defs>
    <linearGradient id="bg" x1="60" y1="20" x2="340" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b1b52"/>
      <stop offset="0.5" stop-color="#6b2f8f"/>
      <stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <radialGradient id="halo" cx="200" cy="170" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shirt" x1="200" y1="280" x2="200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b4a8f"/>
      <stop offset="1" stop-color="#242a55"/>
    </linearGradient>
    <linearGradient id="skin" x1="200" y1="110" x2="200" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe9dc"/>
      <stop offset="1" stop-color="#f6c6ab"/>
    </linearGradient>
    <linearGradient id="hair" x1="200" y1="60" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#413055"/>
      <stop offset="1" stop-color="#1d152c"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#halo)"/>
  <circle cx="322" cy="86" r="52" fill="#ffd166" opacity="0.22"/>
  <circle cx="82" cy="122" r="30" fill="#2ee6c5" opacity="0.18"/>

  <!-- 肩部与衣领 -->
  <path d="M52 400c0-78 66-126 148-126s148 48 148 126Z" fill="url(#shirt)"/>
  <path d="M148 300c18 28 86 28 104 0l16 6c-10 42-126 42-136 0Z" fill="#1b2144"/>

  <!-- 脖子 -->
  <path d="M172 246h56v58c0 18-56 18-56 0Z" fill="#eeb394"/>

  <!-- 头 -->
  <ellipse cx="200" cy="188" rx="104" ry="110" fill="url(#skin)"/>
  <ellipse cx="94" cy="200" rx="17" ry="24" fill="#f2bd9f"/>
  <ellipse cx="306" cy="200" rx="17" ry="24" fill="#f2bd9f"/>

  <!-- 头发 -->
  <path d="M92 186c-10-92 58-140 116-136 62 4 104 48 100 138-6-44-30-66-58-70-8-24-40-34-62-20-24-10-58-2-70 24-16 10-24 32-26 64Z" fill="url(#hair)"/>
  <path d="M118 150c22-40 76-58 118-40" stroke="#5b4677" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.65"/>

  <!-- 眉毛 -->
  <path d="M146 172c10-8 26-9 38-2" stroke="#33202b" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M216 170c12-7 28-6 38 2" stroke="#33202b" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- 眼睛（得意眯眯眼） -->
  <path d="M148 198c10-14 26-14 36 0" stroke="#33202b" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M216 198c10-14 26-14 36 0" stroke="#33202b" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- 腮红 -->
  <ellipse cx="132" cy="226" rx="19" ry="10" fill="#ff7b95" opacity="0.55"/>
  <ellipse cx="268" cy="226" rx="19" ry="10" fill="#ff7b95" opacity="0.55"/>

  <!-- 嘴 -->
  <path d="M184 240c10 12 22 12 32 0" stroke="#a8495e" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- 汗滴（被催出来的） -->
  <path d="M312 142c16 26 14 40 1 45-12-6-14-20-1-45Z" fill="#9fdcff" opacity="0.9"/>

  <!-- 闪光 -->
  <path d="M318 250l6 16 16 6-16 6-6 16-6-16-16-6 16-6Z" fill="#ffd166" opacity="0.85"/>
  <path d="M86 268l4 11 11 4-11 4-4 11-4-11-11-4 11-4Z" fill="#ffd166" opacity="0.7"/>
</svg>
